<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Server Monitor
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <a
        href="{{ url_for('dashboard') }}"
        class="logo"
    >
        <span class="logo-dot"></span>
        Server Monitor
    </a>

    <nav>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('admin') }}">
            Admin
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
